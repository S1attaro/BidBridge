{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="wrap page">
  <div class="card narrow auth">
    <h1>Welcome back</h1>
    <p class="muted">Log in to see your matches and saved jobs.</p>
    <form method="post">
      {% csrf_token %}
      {% include "includes/form.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn dark full">Log in</button>
    </form>
    <p class="switch-link">New here? <a href="{% url 'core:signup' %}">Get started free</a></p>
  </div>
</div>
{% endblock %}
