{% if user.is_authenticated %}
<form method="post" action="{% url 'saved:toggle' c.notice_id %}" class="js-save">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button class="heart" aria-label="Save {{ c.display_title }}" aria-pressed="{% if c.id in saved_ids %}true{% else %}false{% endif %}"><svg viewBox="0 0 16 16"><path d="M8 13.5C4.5 11.2 1.5 8.8 1.5 5.7 1.5 3.9 2.9 2.5 4.7 2.5c1.3 0 2.4.7 3.3 1.9.9-1.2 2-1.9 3.3-1.9 1.8 0 3.2 1.4 3.2 3.2 0 3.1-3 5.5-6.5 7.8z"/></svg></button>
</form>
{% else %}
<a class="heart" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}" aria-label="Log in to save"><svg viewBox="0 0 16 16"><path d="M8 13.5C4.5 11.2 1.5 8.8 1.5 5.7 1.5 3.9 2.9 2.5 4.7 2.5c1.3 0 2.4.7 3.3 1.9.9-1.2 2-1.9 3.3-1.9 1.8 0 3.2 1.4 3.2 3.2 0 3.1-3 5.5-6.5 7.8z"/></svg></a>
{% endif %}
